# =============================================================================
# NAS-YOLO-n (Nano) — T4 GPU (16GB VRAM) 최적화 설정
# =============================================================================
# Google Colab 무료 T4 환경에 맞춘 설정
# - 배치 사이즈 축소 (VRAM 16GB)
# - Gradient Accumulation으로 실효 배치 보상
# - 체크포인트 자주 저장 (세션 끊김 대비)
# - AMP 필수 (메모리 절약)
# =============================================================================

model:
  num_classes: 80
  model_scale: "nano"
  use_noise_gate: true
  use_temporal: true
  noise_dim: 16
  ema_momentum: 0.9

training:
  epochs: 100
  batch_size: 16              # T4 16GB에 맞춤
  warmup_epochs: 5
  base_lr: 0.01
  min_lr: 0.00001
  weight_decay: 0.0005
  momentum: 0.937
  amp: true                   # 필수: 메모리 절약
  grad_accum_steps: 2         # 실효 배치 = 16 x 2 = 32
  clip_grad_norm: 10.0
  save_interval: 5            # 5 에폭마다 저장 (세션 끊김 대비)
  eval_interval: 10
  log_interval: 50

  temporal_training: false
  sequence_length: 5
  tcl_weight: 0.5
  tcl_ema: 0.95

data:
  img_size: [640, 640]
  num_workers: 2              # Colab은 CPU 코어가 제한적

augmentation:
  mosaic: true
  mixup: false                # T4에서는 MixUp 생략 (속도)
  corruption_aug: false

output:
  dir: "runs/nas_yolo_n_t4"
