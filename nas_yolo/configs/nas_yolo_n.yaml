# =============================================================================
# NAS-YOLO-n (Nano) — Edge Deployment Configuration
# =============================================================================
# Target: < 4M params, < 5ms latency on Jetson Nano
# =============================================================================

model:
  num_classes: 80
  model_scale: "nano"
  use_noise_gate: true
  use_temporal: true
  noise_dim: 16              # Reduced for edge efficiency
  ema_momentum: 0.9

training:
  epochs: 300
  batch_size: 32             # Smaller model → larger batch
  base_lr: 0.01
  amp: true

augmentation:
  mosaic: true
  mixup: false               # Skip MixUp for speed

output:
  dir: "runs/nas_yolo_n"
