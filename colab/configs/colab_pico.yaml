# PicoYOLO — Colab Training Config (T4 GPU)
# Smoke test: use colab_smoke_test.yaml first, then switch to this

model:
  type: "pico_yolo"
  base_channels: 32
  num_classes: 80
  input_resolution: 320
  expand_ratio: 2.0
  channels_list: [64, 128, 128]

plugin:
  profile: "pico"
  mode: "hybrid"
  use_noise_gate: true
  noise_dim: 32
  pool_size: 4
  weight_sharing: true
  gradient_checkpointing: true        # T4 memory optimization
  use_parallel_scan: false
  use_context: false

training:
  stage1_epochs: 20
  stage2_epochs: 280
  batch_size: 64                      # T4: 64, A100: 128
  base_lr: 0.02
  weight_decay: 0.0005
  warmup_epochs: 10
  grad_accum_steps: 2                 # Effective batch = 64 × 2 = 128
  clip_grad_norm: 10.0
  amp: true
  ema: true
  ema_decay: 0.9999
  temporal_training: true
  sequence_length: 5
  tcl_weight: 0.5

kd:
  enabled: true
  teacher_weights: "yolov8n.pt"
  alpha_feature: 0.5
  alpha_output: 0.5
  temperature: 4.0

augmentation:
  corruption_aug: true
  corruption_p: 0.3
  mosaic: true
  mixup: 0.1

data:
  train: "coco/train2017"
  val: "coco/val2017"
  img_size: 320

output:
  dir: "runs/pico_colab"
  save_every: 20
