# SA-SSM Plugin — Tiny Profile Training (Smart Glasses, COCO 2017)
# Smallest plugin: ~0.15M overhead (4%), gate_min=0.20

model:
  yolo_variant: "yolov8n"
  pretrained_weights: "yolov8n.pt"
  framework: "ultralytics"
  num_classes: 80
  channels_list: [64, 128, 256]

plugin:
  profile: "tiny"                # SE attention, d_state=4, d_conv=2
  mode: "hybrid"
  use_noise_gate: true
  noise_dim: 32
  pool_size: 8
  gradient_checkpointing: true
  use_parallel_scan: false

training:
  stage1_epochs: 15
  stage2_epochs: 85
  batch_size: 16
  base_lr: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3
  grad_accum_steps: 2
  clip_grad_norm: 10.0
  amp: true
  ema: true
  ema_decay: 0.9999
  temporal_training: true
  sequence_length: 5
  tcl_weight: 0.5

augmentation:
  corruption_aug: true
  corruption_p: 0.3
  mosaic: true
  mixup: 0.1

data:
  train: "coco/train2017"
  val: "coco/val2017"
  img_size: 640

output:
  dir: "runs/yolov8n_tiny"
  save_every: 10
